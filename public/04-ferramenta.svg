<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Chave de ferramenta">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071523"/><stop offset="1" stop-color="#030b16"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e8eeff"/><stop offset=".5" stop-color="#a4b4df"/><stop offset="1" stop-color="#5c72aa"/></linearGradient>

  <filter id="depth3d" x="-60%" y="-60%" width="230%" height="240%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="soft"/>
    <feOffset in="soft" dx="5" dy="9" result="offset"/>
    <feComponentTransfer in="offset" result="shadow"><feFuncA type="linear" slope="0.68"/></feComponentTransfer>
    <feGaussianBlur in="SourceAlpha" stdDeviation="1.7" result="bevel"/>
    <feSpecularLighting in="bevel" surfaceScale="5" specularConstant="0.9" specularExponent="24" lighting-color="#ffffff" result="shine"><fePointLight x="45" y="25" z="150"/></feSpecularLighting>
    <feComposite in="shine" in2="SourceAlpha" operator="in" result="shineCut"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="aura"/>
    <feComponentTransfer in="aura" result="auraSoft"><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="auraSoft"/><feMergeNode in="SourceGraphic"/><feMergeNode in="shineCut"/></feMerge>
  </filter>
</defs>
<rect width="256" height="256" rx="30" fill="url(#bg)"/><rect x="4" y="4" width="248" height="248" rx="27" fill="none" stroke="#6fa8ff" stroke-opacity=".09" stroke-width="2"/>

<g filter="url(#depth3d)">
 <path d="M205 39c-20-9-44-5-59 10-17 17-20 43-9 63L57 192a23 23 0 0 0 33 33l80-80c20 11 46 8 63-9 15-15 19-39 10-59l-33 33-28-7-7-28z" fill="url(#steel)"/>
 <circle cx="74" cy="208" r="10" fill="#293d67"/>
</g>
</svg>